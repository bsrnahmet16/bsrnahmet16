name: Melipo A Scenes 01-03

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/melipo-a-scenes-01-03.yml"
      - "melipo_a_video/render_batch_01.py"
      - "melipo_a_video/assets_meadow_chunks/**"

permissions:
  contents: read

concurrency:
  group: melipo-a-scenes-01-03
  cancel-in-progress: true

jobs:
  render:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - scene: 1
            start: "0.000"
            duration: "5.460"
          - scene: 2
            start: "5.460"
            duration: "4.720"
          - scene: 3
            start: "10.180"
            duration: "6.360"
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install render tools
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy ffmpeg libegl1 libgl1-mesa-dri
      - name: Download canonical sources and verify meadow
        working-directory: melipo_a_video
        run: |
          mkdir -p assets frames
          curl --fail --location --retry 5 -o a_song_vocals.mp3 https://d1ojnqroiei5k7.cloudfront.net/melipo/music/A/v1/a_song_vocals.mp3
          curl --fail --location --retry 5 -o assets/Pofi_3D_rigged.glb https://d1ojnqroiei5k7.cloudfront.net/melipo/characters/v1/Pofi_3D_rigged.glb
          cat assets_meadow_chunks/premium_meadow_background.b64.part* | base64 -d > assets/premium_meadow_background_v1.png
          echo "07b399dcf68a056a50b00ff4929d71ccc6be054e7b73ab2cb48c33edc1d3f2bf  assets/premium_meadow_background_v1.png" | sha256sum -c -
      - name: Render scene ${{ matrix.scene }}
        working-directory: melipo_a_video
        run: |
          sid=$(printf '%02d' ${{ matrix.scene }})
          LIBGL_ALWAYS_SOFTWARE=1 EGL_PLATFORM=surfaceless blender --background --python-exit-code 1 --python render_batch_01.py -- ${{ matrix.scene }}
          test -f frames/scene_${sid}_0001.png
      - name: Encode exact master segment
        working-directory: melipo_a_video
        run: |
          sid=$(printf '%02d' ${{ matrix.scene }})
          ffmpeg -y -framerate 30 -i frames/scene_${sid}_%04d.png -ss ${{ matrix.start }} -t ${{ matrix.duration }} -i a_song_vocals.mp3 -c:v libx264 -preset medium -crf 17 -pix_fmt yuv420p -c:a aac -b:a 192k -shortest -movflags +faststart a_scene_${sid}.mp4
          ffprobe -v error -show_entries format=duration -show_entries stream=width,height,r_frame_rate -of json a_scene_${sid}.mp4
      - name: Upload scene review package
        uses: actions/upload-artifact@v4
        with:
          name: melipo-a-scene-${{ matrix.scene }}
          path: |
            melipo_a_video/a_scene_*.mp4
            melipo_a_video/a_scene_*.blend
            melipo_a_video/frames/*.png
          retention-days: 5
