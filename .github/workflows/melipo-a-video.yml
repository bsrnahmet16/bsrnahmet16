name: Melipo A Video Preflight

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/melipo-a-video.yml"
      - "melipo_a_video/**"

permissions:
  contents: read

concurrency:
  group: melipo-a-video-preflight
  cancel-in-progress: true

jobs:
  timing-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install timing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install faster-whisper

      - name: Download master A song
        working-directory: melipo_a_video
        run: |
          curl --fail --location --retry 5 -o a_song_vocals.mp3 https://d1ojnqroiei5k7.cloudfront.net/melipo/music/A/v1/a_song_vocals.mp3
          test -s a_song_vocals.mp3

      - name: Extract real word timing and build exact manifest
        working-directory: melipo_a_video
        run: |
          python build_manifest.py
          test -s preflight/word_timestamps.json
          test -s preflight/scene_manifest.json

      - name: Upload temporary preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: melipo-a-preflight
          path: melipo_a_video/preflight/
          retention-days: 3
