name: Melipo A Premium Car Canary
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/melipo-a-premium-canary.yml"
      - "melipo_a_video/render_premium_car_canary.py"
permissions:
  contents: read
concurrency:
  group: melipo-a-premium-car-canary
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg libegl1 libgl1-mesa-dri
      - name: Download canonical and CC0 assets
        working-directory: melipo_a_video
        run: |
          mkdir -p assets frames
          curl --fail --location --retry 5 -o a_song_vocals.mp3 https://d1ojnqroiei5k7.cloudfront.net/melipo/music/A/v1/a_song_vocals.mp3
          curl --fail --location --retry 5 -o assets/Pofi_3D_rigged.glb https://d1ojnqroiei5k7.cloudfront.net/melipo/characters/v1/Pofi_3D_rigged.glb
      - name: Render premium A ile araba canary
        working-directory: melipo_a_video
        run: |
          LIBGL_ALWAYS_SOFTWARE=1 EGL_PLATFORM=surfaceless blender --background --python render_premium_car_canary.py
          test -f frames/premium_car_0001.png
          test -f frames/premium_car_0150.png
      - name: Encode exact lyric segment
        working-directory: melipo_a_video
        run: |
          ffmpeg -y -framerate 30 -i frames/premium_car_%04d.png -ss 22.500 -t 5.000 -i a_song_vocals.mp3 -c:v libx264 -preset medium -crf 17 -pix_fmt yuv420p -c:a aac -b:a 192k -shortest -movflags +faststart a_premium_car_canary.mp4
          ffprobe -v error -show_entries format=duration -show_entries stream=width,height,r_frame_rate -of json a_premium_car_canary.mp4
      - name: Upload temporary review package
        uses: actions/upload-artifact@v4
        with:
          name: melipo-a-premium-car-canary
          path: |
            melipo_a_video/a_premium_car_canary.mp4
            melipo_a_video/a_premium_car_canary.blend
            melipo_a_video/frames/premium_car_0033.png
            melipo_a_video/frames/premium_car_0075.png
            melipo_a_video/frames/premium_car_0126.png
          retention-days: 3
