name: Melipo A Full Video Preflight

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/melipo-a-full-preflight.yml"
      - "melipo_a_video/build_manifest.py"

permissions:
  contents: read

concurrency:
  group: melipo-a-full-video-preflight
  cancel-in-progress: true

jobs:
  timing:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install timing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install "faster-whisper==1.2.1"

      - name: Download master A song
        working-directory: melipo_a_video
        run: |
          curl --fail --location --retry 5 -o a_song_vocals.mp3 https://d1ojnqroiei5k7.cloudfront.net/melipo/music/A/v1/a_song_vocals.mp3

      - name: Extract real word timing and build 30-scene manifest
        working-directory: melipo_a_video
        run: |
          rm -rf preflight
          python build_manifest.py
          test -s preflight/transcript.txt
          test -s preflight/word_timestamps.json
          test -s preflight/object_cues.json
          test -s preflight/scene_manifest.json
          python - <<'PY'
          import json
          p=json.load(open("preflight/scene_manifest.json",encoding="utf-8"))
          assert p["scene_count"] == 30
          assert abs(p["scene_duration_sum"] - 163.920) < 0.001
          assert len(p["scenes"]) == 30
          assert len({x["scene_id"] for x in p["scenes"]}) == 30
          print({"duration":p["audio_duration"],"scenes":len(p["scenes"])})
          PY

      - name: Upload preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: melipo-a-full-preflight
          path: melipo_a_video/preflight/
          retention-days: 7
